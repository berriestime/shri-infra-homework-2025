name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0, 1.1.0, 2.0.0)'
        required: true
        type: string
      confirm:
        description: 'Type "yes" to confirm release creation'
        required: true
        default: 'no'

env:
  REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
  IMAGE_NAME: app

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint
      - run: npm run test

  release:
    needs: lint_and_test
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.set_version.outputs.version }}
      commits_list: ${{ steps.get_commits.outputs.commits }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set release version
        id: set_version
        run: echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT

      - name: Create release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b releases/${{ steps.set_version.outputs.version }}
          git push origin releases/${{ steps.set_version.outputs.version }}

      - name: Get commits since last release
        id: get_commits
        run: |
          LAST_TAG=$(git tag -l "*.*.*" --sort=-version:refname | head -n 1)
          if [ -z "$LAST_TAG" ]; then
            LAST_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          COMMITS=$(git log --pretty=format:"- %s (%h)" ${LAST_TAG}..HEAD)
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Yandex Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.JSON_CREDENTIALS }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ steps.set_version.outputs.version }}
            cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest

      - name: Create git tag
        run: |
          git tag ${{ steps.set_version.outputs.version }}
          git push origin ${{ steps.set_version.outputs.version }}

      - name: Update CHANGELOG.md
        run: |
          TODAY=$(date '+%Y-%m-%d')
          TEMP_FILE=$(mktemp)
          echo "# Version ${{ steps.set_version.outputs.version }} - $TODAY" > $TEMP_FILE
          echo "" >> $TEMP_FILE
          echo "${{ steps.get_commits.outputs.commits }}" >> $TEMP_FILE
          echo "" >> $TEMP_FILE
          if [ -f CHANGELOG.md ]; then
            cat CHANGELOG.md >> $TEMP_FILE
          fi
          mv $TEMP_FILE CHANGELOG.md
          git add CHANGELOG.md
          git commit -m "Update CHANGELOG for version ${{ steps.set_version.outputs.version }}"
          git push origin releases/${{ steps.set_version.outputs.version }}

      - name: Deploy to VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ steps.set_version.outputs.version }}
            docker stop app || true
            docker rm app || true
            docker run -d --name app \
              -p 80:3000 \
              cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ steps.set_version.outputs.version }}

  create_issue:
    runs-on: ubuntu-latest
    needs: release
    
    steps:
      - name: Create release issue
        uses: actions/github-script@v7
        env:
          REGISTRY_ID: ${{ env.REGISTRY_ID }}
          VERSION: ${{ needs.release.outputs.release_version }}
        with:
          script: |
            const registryId = process.env.REGISTRY_ID;
            const version = process.env.VERSION;
            
            const issueBody = `## Release Information
            
            **Date**: ${new Date().toISOString().split('T')[0]}
            **Author**: @${{ github.actor }}
            **Version**: ${version}
            **Release Branch**: \`releases/${version}\`
            
            ## Docker Image
            \`cr.yandex/${registryId}/app:${version}\`
            
            ## Changes in this Release
            ${{ needs.release.outputs.commits_list }}
            
            ## Deployment Status
            - Release branch created
            - Docker image built and pushed  
            - Git tag created
            - CHANGELOG updated
            - Successfully deployed to production VM
            
            ---
            *This issue was automatically created by the release workflow.*`;
            
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release ${{ needs.release.outputs.release_version }}`,
              body: issueBody,
              labels: ['release']
            });